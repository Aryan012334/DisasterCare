{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <title>CRDR - Password Updated</title>

    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <link href="{% static 'css/rdms.css' %}" rel="stylesheet">

<body>
